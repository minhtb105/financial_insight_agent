services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: talenthub-ai-dev
    ports:
      - "${APP_EXTERNAL_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - APP_PORT=${APP_PORT:-8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_CANDIDATES_COLLECTION=${QDRANT_CANDIDATES_COLLECTION:-talenthub_candidates}
      - QDRANT_JOBS_COLLECTION=${QDRANT_JOBS_COLLECTION:-talenthub_jobs}
    volumes:
      - ./src:/app/src:cached
      - ./tests:/app/tests:cached
      - ./input:/app/input:cached
      - ./output:/app/output
      - /app/src/__pycache__
      - /app/tests/__pycache__
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - talenthub-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: talenthub-ai-qdrant-dev
    ports:
      - "${QDRANT_EXTERNAL_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage_dev:/qdrant/storage
    networks:
      - talenthub-network

networks:
  talenthub-network:
    driver: bridge

volumes:
  qdrant_storage_dev:
