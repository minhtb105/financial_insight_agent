services:
  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: finsight-mcp
    ports:
      - "${MCP_EXTERNAL_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - finsight-network
    restart: unless-stopped
    command: python -m mcp_server.server --transport streamable-http --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/mcp"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-finsight}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-finsight}
      - POSTGRES_DB=${POSTGRES_DB:-finsight}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    networks:
      - finsight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight} -d ${POSTGRES_DB:-finsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_storage:/data
    networks:
      - finsight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: finsight-backend
    ports:
      - "${APP_EXTERNAL_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - APP_PORT=${APP_PORT:-8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://frontend:3000}
      - ENABLE_RAG_SCHEDULER=${ENABLE_RAG_SCHEDULER:-true}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - MCP_URL=http://mcp_server:8001/mcp
      - MCP_TRANSPORT=streamable-http
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@postgres:5432/${POSTGRES_DB:-finsight}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-finsight}:${POSTGRES_PASSWORD:-finsight}@postgres:5432/${POSTGRES_DB:-finsight}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@finsight.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_server:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - finsight-network
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn interfaces.api.app:app --host 0.0.0.0 --port $${APP_PORT:-8000} --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight-frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-finsight-dev-secret-change-me-in-prod}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - API_URL=http://backend:${APP_PORT:-8000}
      - NEXT_PUBLIC_API_URL=http://localhost:${APP_EXTERNAL_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finsight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finsight-qdrant
    ports:
      - "${QDRANT_EXTERNAL_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - finsight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  finsight-network:
    driver: bridge

volumes:
  qdrant_storage:
  postgres_storage:
  redis_storage:
