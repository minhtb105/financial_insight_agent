[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial_insight_agent"
version = "0.1.1"
description = "An AI-powered question-answering agent that retrieves company information and historical stock data from vnstock, with support for SMA and RSI indicators through a REST API."
authors = [
    { name = "Minh Tran Binh", email = "kisuit4.0@gmail.com" }
]

dependencies = [
    "langchain>=0.3.27,<0.4",
    "langchain-openai>=0.3.0,<0.4",
    "langchain-groq>=0.3.0,<0.4",
    "langgraph>=0.5.0",
    "langchain-text-splitters>=0.3.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "matplotlib>=3.10.7",
    "tqdm>=4.67.1",
    "requests>=2.30.5",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "qdrant-client>=1.11.0",
    "openai>=1.50.0",
    "apscheduler>=3.10.0",
    "pymupdf>=1.24.0",
    "pdfminer.six>=20221105",
    "fastapi>=0.121.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "msgpack>=1.0.0",
    "vnstock>=3.0.0,<4",
    "sentence-transformers>=2.2.0",
    "PyYAML>=6.0.1",
    "mcp>=1.9.0",
    "langchain-mcp-adapters>=0.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.31.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
]

memory = [
    "psycopg2-binary>=2.9.0",
    "sentence-transformers>=2.2.0",
    "psutil>=5.9.0",
]

eval = [
    "ragas>=0.2.6,<0.3",
    "datasets>=2.20.0,<4",
    "langchain-community>=0.3.24,<0.4",
    "openai>=1.50.0",
    "pyyaml>=6.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by black)
    "B008",    # do not perform function calls in argument defaults
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value comparison
    "PLW0603", # global statements (intentional singleton pattern)
    "PLW0602", # global used but no assignment (function-level globals)
    "PLC0415", # lazy imports (intentional circular import avoidance)
    "PLR0911", # too many return statements (existing validation)
    "PLR0912", # too many branches (existing validation)
    "PLR0124", # self-comparison for NaN (intentional)
    "W291",    # trailing whitespace (SQL strings)
    "W293",    # blank line whitespace (extensive in memory files)
    "SIM117",  # nested with statements (context managers in memory files)
    "RUF003",  # en-dash in comments
    "UP035",   # deprecated typing aliases
    "UP006",   # Dict -> dict
    "UP045",   # Optional[X] -> X | None
    "UP017",   # datetime.UTC alias (timezone.utc works with from datetime import datetime, timezone)
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "domain", "application", "infrastructure", "interfaces", "mcp_server"]
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["ARG", "PLC0415", "PTH108", "E402", "F841", "PLW0108", "SIM117", "PLR2004", "UP017"]
"tests/**" = ["ARG", "PLC0415", "PTH108", "E402", "F841", "PLW0108", "SIM117", "PLR2004", "UP017"]
"__init__.py" = ["F401"]
# LangChain callback signatures require these parameter names even when unused
"src/infrastructure/observability/tracing/langchain_handler.py" = ["ARG002"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require external services)",
    "slow: Tests that take longer than normal",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 35
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
